server {
    listen 80;
    server_name _;

    # Brand assets from domain root. This keeps /logo.svg and /favicon.svg
    # working even when the admin UI is hosted under /admin.
    location = /logo.svg {
        proxy_pass http://cortex:31338/admin/logo.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.svg {
        proxy_pass http://cortex:31338/admin/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Per-profile WebSocket endpoints ─────────────────────────────────────
    # Only WS per slot. ALL static files (vnc.html, app/, core/, etc.) come
    # from the shared websockify on cortex:6080 below — one source of truth,
    # no per-slot static file path issues.
    #
    # Slot N → cortex:609N (WS-only, no --web). Each iframe loads the SAME
    # /novnc/vnc.html page; the page knows which slot to connect to from its
    # ?path= URL parameter (set by the frontend per account).
    location = /novnc/d0/websockify { proxy_pass http://cortex:6090/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d1/websockify { proxy_pass http://cortex:6091/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d2/websockify { proxy_pass http://cortex:6092/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d3/websockify { proxy_pass http://cortex:6093/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d4/websockify { proxy_pass http://cortex:6094/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d5/websockify { proxy_pass http://cortex:6095/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d6/websockify { proxy_pass http://cortex:6096/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d7/websockify { proxy_pass http://cortex:6097/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d8/websockify { proxy_pass http://cortex:6098/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }
    location = /novnc/d9/websockify { proxy_pass http://cortex:6099/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 86400; }

    # noVNC static assets and main viewer page (shared :99 fallback).
    location /novnc/ {
        proxy_pass http://cortex:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # noVNC websocket endpoint (shared display).
    location /websockify {
        proxy_pass http://cortex:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Some noVNC builds emit prefixed websocket paths.
    location /novnc/websockify {
        proxy_pass http://cortex:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Main API and admin panel.
    location / {
        proxy_pass http://cortex:31338;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
