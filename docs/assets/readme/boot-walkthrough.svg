<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111D"/>
      <stop offset="1" stop-color="#0E2430"/>
    </linearGradient>
    <linearGradient id="card" x1="90" y1="150" x2="1190" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132338"/>
      <stop offset="1" stop-color="#0E1828"/>
    </linearGradient>
    <linearGradient id="lineA" x1="300" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="lineC" x1="0" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>

  <text x="72" y="84" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Docker setup flow</text>
  <text x="72" y="118" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">From boot to provider-ready API access.</text>

  <rect x="72" y="160" width="1136" height="500" rx="28" fill="#0B1523" stroke="#1E3A5F"/>

  <g>
    <rect x="104" y="218" width="220" height="244" rx="24" fill="url(#card)" stroke="#264866"/>
    <text x="134" y="258" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. Boot</text>
    <rect x="132" y="284" width="164" height="54" rx="14" fill="#111F31"/>
    <text x="150" y="317" fill="#E2E8F0" font-family="Consolas, monospace" font-size="15">docker compose up</text>
    <circle cx="214" cy="382" r="22" fill="#1D4ED8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="176" y="388" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">stack live</text>
    <text x="132" y="438" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Start the containers.</text>
  </g>

  <g>
    <rect x="374" y="218" width="220" height="244" rx="24" fill="url(#card)" stroke="#264866"/>
    <text x="404" y="258" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. Sign in</text>
    <rect x="430" y="304" width="108" height="56" rx="16" fill="#0F766E">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="457" y="339" fill="#ECFEFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">admin</text>
    <text x="410" y="438" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Open the admin panel.</text>
  </g>

  <g>
    <rect x="644" y="218" width="220" height="244" rx="24" fill="url(#card)" stroke="#264866"/>
    <text x="674" y="258" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">3. Connect</text>
    <circle cx="694" cy="322" r="7" fill="#22C55E">
      <animate attributeName="r" values="6;10;6" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="712" y="327" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">chatgpt</text>
    <circle cx="694" cy="356" r="7" fill="#22C55E">
      <animate attributeName="r" values="6;10;6" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="712" y="361" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">gemini</text>
    <circle cx="694" cy="390" r="7" fill="#22C55E">
      <animate attributeName="r" values="6;10;6" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="712" y="395" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">grok</text>
    <text x="676" y="438" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Log in to providers.</text>
  </g>

  <g>
    <rect x="914" y="218" width="220" height="244" rx="24" fill="url(#card)" stroke="#264866"/>
    <text x="944" y="258" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">4. Use API</text>
    <rect x="954" y="308" width="140" height="64" rx="16" fill="#111F31"/>
    <text x="978" y="346" fill="#BFDBFE" font-family="Consolas, monospace" font-size="16">ctx_abc123...</text>
    <rect x="954" y="394" width="140" height="14" rx="7" fill="#12324B"/>
    <rect x="954" y="394" width="16" height="14" rx="7" fill="#38BDF8">
      <animate attributeName="width" values="16;140;16" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="964" y="438" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Issue keys and call v1.</text>
  </g>

  <path d="M324 340H374" stroke="url(#lineA)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M594 340H644" stroke="url(#lineB)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </path>
  <path d="M864 340H914" stroke="url(#lineC)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <rect x="228" y="542" width="824" height="62" rx="18" fill="#0D1727" stroke="#1E3A5F"/>
  <text x="332" y="580" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Docker  ->  Admin  ->  Providers  ->  API Keys  ->  Traffic</text>
</svg>
