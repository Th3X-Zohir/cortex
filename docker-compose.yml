services:
  cortex:
    build: .
    image: cortex
    container_name: cortex
    ports:
      - "31339:31338"
      - "5901:5900"
      - "6081:6080"
    environment:
      DISPLAY: ":99"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - cortex-profiles:/root/.cortex
    restart: unless-stopped

volumes:
  cortex-profiles:
