services:
  cortex:
    build: .
    image: cortex
    container_name: cortex
    ports:
      - "31339:31338"
      - "5901:5900"
      - "6081:6080"
    environment:
      DISPLAY: ":99"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - cortex-profiles:/root/.cortex
    restart: unless-stopped
    depends_on:
      - admin

  admin:
    build: ./admin
    image: cortex-admin
    container_name: cortex-admin
    ports:
      - "31337:31337"
    volumes:
      - ./admin/data:/app/data
    restart: unless-stopped

volumes:
  cortex-profiles:
