services:
  cortex:
    build: .
    container_name: cortex
    ports:
      - "31338:31338"
      - "5900:5900"
      - "6080:6080"
    environment:
      DISPLAY: ":99"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - cortex-profiles:/root/.cortex
    restart: unless-stopped

volumes:
  cortex-profiles:
