services:
  cortex:
    build: .
    image: cortex
    container_name: cortex
    expose:
      - "31338"
      - "5900"
      - "6080"
    environment:
      DISPLAY: ":99"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - cortex-profiles:/root/.cortex
    restart: unless-stopped

  cortex-proxy:
    image: nginx:1.27-alpine
    container_name: cortex-proxy
    depends_on:
      - cortex
    ports:
      - "31339:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  cortex-profiles:
